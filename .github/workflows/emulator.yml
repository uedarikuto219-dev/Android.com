name: Android Emulator CI

on:
  push:
    branches: [ "main", "主要" ] # コードがプッシュされたら自動実行
  workflow_dispatch: # ボタンを押して手動で実行することも可能にする設定

jobs:
  run-emulator:
    runs-on: macos-13 # エミュレータを最速で動かすため、ハードウェア仮想化が標準対応しているmacOS環境を使用
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Javaの設定
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDKのセットアップ
        uses: android-actions/setup-android@v3

      - name: システムイメージのダウンロードとAVD作成・プロ向け高速起動
        run: |
          # 1. 必要なシステムイメージを取得 (API 34 / Google APIs)
          sdkmanager "system-images;android-34;google_apis;x86_64"

          # 2. ワイド画面(tv_1080p = 1920x1080)のエミュレータを作成
          echo "no" | avdmanager create avd -n "WideHeadlessAndroid" -k "system-images;android-34;google_apis;x86_64" -d "tv_1080p" --force

          # 3. プロ向けの高速化オプションをフル適用してバックグラウンドで起動（画面なし）
          echo "=== エミュレータをプロ仕様で起動します ==="
          $ANDROID_HOME/emulator/emulator -avd WideHeadlessAndroid \
            -no-window \
            -gpu swiftshader_indirect \
            -memory 4096 \
            -cores 4 \
            -no-audio \
            -no-boot-anim &

          # 4. 完全起動を待機するプロ用ループ処理
          echo "=== Android OSの起動完了を待機中... ==="
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ] ; do
            echo "起動を待っています... (5秒後に再確認)"
            sleep 5
          done

          echo "=================================================="
          echo "★ ワイド画面・ヘッドレスエミュレータの起動に成功しました！"
          echo "=================================================="
          
          # 動作確認として、起動したエミュレータのデバイス情報を出力してみる
          adb devices
